<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Card Validator</title><script defer="defer" src="main.js"></script></head><body><div class="container"><h1>Credit Card Validator</h1><div class="card-icons"><div class="card-icon-container" id="card-visa"><img src="" alt="Visa" class="card-icon"> <span>VISA</span></div><div class="card-icon-container" id="card-mir"><img src="" alt="МИР" class="card-icon"> <span>МИР</span></div><div class="card-icon-container" id="card-american-express"><img src="" alt="American Express" class="card-icon"> <span>AMERICAN<br>EXPRESS</span></div><div class="card-icon-container" id="card-discover"><img src="" alt="Discover" class="card-icon"> <span>DISCOVER</span></div><div class="card-icon-container" id="card-jcb"><img src="" alt="JCB" class="card-icon"> <span>JCB</span></div><div class="card-icon-container" id="card-diners"><img src="" alt="Diners Club" class="card-icon"> <span>DINERS CLUB</span></div></div><div class="input-group"><input id="card-number" placeholder="Введите номер карты" value="4111111111111111"> <button id="validate-btn">Click to Validate</button></div><div id="result" class="result"></div><div class="info"><p>Поддерживаются карты: Visa, МИР, American Express, JCB, Discover, Diners Club</p><p>Алгоритм Луны (Luhn algorithm) для проверки контрольной суммы</p><p>Пример: 4111 1111 1111 1111 (Visa)</p></div></div></body></html>
